<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiroku - Manga</title>
  <script>
    const savedTheme = localStorage.getItem("theme");
    if (savedTheme === "dark" || savedTheme === "light") {
      document.documentElement.dataset.theme = savedTheme;
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="module" src="./script.js"></script>
</head>
<body>
  <div id="app">
    <header class="nav">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"></div>
        <div class="brand-text">
          <h1>KIROKU</h1>
          <span>記録 · manga</span>
        </div>
      </div>

      <div class="nav-end">
        <a class="pill-btn is-active" href="/index.html">Anime</a>

        <div class="user-menu" id="user-menu">
          <button type="button" class="user-menu-trigger" id="user-menu-trigger"
            aria-haspopup="true" aria-expanded="false" aria-controls="user-menu-dropdown">
            <img class="user-avatar" src="/my-pfp.jpg" id="user-avatar" alt="Your avatar" />
            <i data-lucide="chevron"></i>
          </button>
          <div class="user-menu-dropdown" id="user-menu-dropdown" hidden>
            <button type="button" class="user-menu-item" data-action="toggle-theme">
              Toggle theme
              <span class="theme-toggle-circle"></span>
            </button>
          </div>
        </div>
      </div>
    </header>

    <main class="coming-soon">
      <div class="coming-soon-mark" aria-hidden="true"></div>
      <span class="coming-soon-eyebrow">記録 · manga</span>
      <h2 class="coming-soon-title">Coming Soon</h2>
      <p class="coming-soon-desc">The manga catalog is coming soon. Search anime instead</p>
      <a class="pill-btn is-active" href="/index.html">Browse Anime</a>
    </main>
  </div>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
