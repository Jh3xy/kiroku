<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kiroku - Anime Search on Demand</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script type="module" src="/src/js/script.js"></script>
  </head>
  <body>
    <div id="app">

      <!-- ===== NAV ===== -->
      <header class="nav">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true"></div>
          <div class="brand-text">
            <h1>KIROKU</h1>
            <span>記録 · anime search</span>
          </div>
        </div>

        <div class="nav-end">
          <nav class="pill-toggle" aria-label="View">
            <button type="button" class="pill-btn is-active" data-view="browse">Browse</button>
            <button type="button" class="pill-btn" data-view="favorites">
              Favorites <span class="fav-count" id="fav-count">0</span>
            </button>
          </nav>

          <!-- ===== USER MENU — avatar src + dropdown contents to be filled in later ===== -->
          <div class="user-menu" id="user-menu">
            <button
              type="button"
              class="user-menu-trigger"
              id="user-menu-trigger"
              aria-haspopup="true"
              aria-expanded="false"
              aria-controls="user-menu-dropdown"
            >
              <img class="user-avatar" src="/my-pfp.jpg" id="user-avatar" alt="Your avatar" />
              <svg class="user-chevron" viewBox="0 0 12 8" fill="none" aria-hidden="true">
                <path d="M1 1.5L6 6.5L11 1.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </button>

            <div class="user-menu-dropdown" id="user-menu-dropdown" hidden>
              <button type="button" class="user-menu-item" data-action="toggle-theme">
                Toggle theme
                <span class="theme-toggle-circle"></span>
              </button>
              <button type="button" class="user-menu-item" data-action="language">
                Language
                <span class="lang-indicator">
                  <b>EN</b> 
                  <span class="lang-toggle-circle">
                  </span>
                </span>
              </button>
            </div>
          </div>
        </div>
      </header>

      <!-- ===== SEARCH ===== -->
      <section class="search-bar">
        <form id="search-form" role="search">
          <i data-lucide="search" class="search-icon" aria-hidden="true"></i>
          <input
            id="search-input"
            class="search-input"
            type="text"
            name="q"
            placeholder="Search anime titles…"
            autocomplete="off"
          />
        </form>
      </section>

      <!-- ===== FEATURED / HERO — JS replaces #hero innerHTML with rendered hero-template ===== -->
      <section class="hero" id="hero" aria-live="polite">
        <div class="hero-art skel skel-art"></div>
        <div class="hero-body">
          <div class="skel skel-line" style="width:70%; height:22px;"></div>
          <div class="skel skel-line" style="width:40%; height:11px; margin-bottom:16px;"></div>
          <div class="skel skel-line" style="width:90%; margin-bottom:6px;"></div>
          <div class="skel skel-line" style="width:80%;"></div>
          <div class="skel skel-line" style="width:60%;"></div>
        </div>
      </section>

      <!-- ===== FAVORITES ROW — hidden entirely when there are no saved titles; hidden during search/Favorites-tab too, loadBrowse() re-shows it ===== -->
      <section class="favorites-row" id="favorites-row" hidden>
        <div class="favorites-row-header">
          <h2>My List</h2>
          <span class="favorites-row-count" id="favorites-row-count"></span>
        </div>
        <div class="favorites-row-track" id="favorites-row-track"></div>
      </section>

      <!-- ===== BROWSE GRID — JS replaces #grid innerHTML with rendered card-template x N ===== -->
      <section class="browse">
        <div class="browse-header">
          <h2 id="browse-title">Browse</h2>
          <span class="browse-count" id="browse-count"></span>
        </div>

        <div class="grid" id="grid" aria-live="polite">
          <!-- Skeleton placeholders shown on first paint, before the first fetch resolves.  -->
          <div class="card card-skeleton" aria-hidden="true"></div>
          <div class="card card-skeleton" aria-hidden="true"></div>
          <div class="card card-skeleton" aria-hidden="true"></div>
          <div class="card card-skeleton" aria-hidden="true"></div>
          <div class="card card-skeleton" aria-hidden="true"></div>
          <div class="card card-skeleton" aria-hidden="true"></div>
        </div>

        <p class="empty-state" id="empty-state" hidden>No titles found. Try another search.</p>
      </section>

      <!-- ===== FOOTER ===== -->
      <footer class="footer">
        <div class="footer-top">
          <div class="footer-brand">
            <div class="brand-mark" aria-hidden="true"></div>
            <div class="footer-brand-text">
              <h2>KIROKU</h2>
              <span>記録</span>
            </div>
          </div>
          <p class="footer-desc">
            A personal anime catalog built on the AniList API — search, browse, and save titles in one place.
          </p>
        </div>

        <div class="footer-links">
          <a class="footer-link" href="https://github.com/Jh3xy/kiroku" target="_blank" rel="noopener noreferrer">
            <i data-lucide="github" aria-hidden="true"></i> Source on GitHub
          </a>
          <a class="footer-link" href="https://arvystech.com" target="_blank" rel="noopener noreferrer">
            <i data-lucide="graduation-cap" aria-hidden="true"></i> Built at ARVYS
          </a>
          <a class="footer-link" href="https://anilist.co" target="_blank" rel="noopener noreferrer">
            <i data-lucide="database" aria-hidden="true"></i> Data via AniList
          </a>
        </div>

        <div class="footer-bottom">
          <span>© <span id="footer-year"></span> Kiroku. Built as an IT final project.</span>
        </div>
      </footer>
    </div>

    <!-- ===== MODAL — hidden by default, JS toggles [hidden] and injects a cloned modal-template ===== -->
    <div class="modal-overlay" id="modal-overlay" hidden>
      <div class="modal">
        <div class="modal-banner skel skel-art"></div>
        <div class="modal-body">
          <div class="skel skel-line" style="width:60%; height:24px; margin-bottom:8px;"></div>
          <div class="skel skel-line" style="width:35%; height:12px; margin-bottom:16px;"></div>
          <div class="skel skel-line" style="width:90%;"></div>
          <div class="skel skel-line" style="width:80%;"></div>
          <div class="skel skel-line" style="width:70%;"></div>
        </div>
      </div>
    </div>

    <!-- ===== TEMPLATES — cloned + populated by script.js once real data arrives ===== -->
    <template id="card-template">
      <div class="card" tabindex="0">
        <div class="card-art">
          <span class="card-score"><span class="score-icon">★</span><span data-field="score"></span></span>
          <div class="card-overlay">
            <div class="card-genre" data-field="genre"></div>
            <div class="card-title" data-field="title"></div>
            <button type="button" class="card-play" data-action="play" aria-label="Play trailer">
              <i data-lucide="play"></i> Play
            </button>
          </div>
        </div>
      </div>
    </template>

    <template id="hero-template">
      <div class="hero-art"></div>
      <div class="hero-overlay" aria-hidden="true"></div>
      <div class="hero-body">
        <h2 class="hero-title" data-field="title"></h2>
        <div class="hero-native" data-field="native"></div>
        <div class="hero-meta" data-field="meta"></div>
        <p class="hero-desc" data-field="description"></p>
        <div class="hero-actions">
          <div class="hero-actions__primary">
            <button type="button" class="play-btn" data-action="play">
              <span class="save-icon">
                <i data-lucide="play"></i>
              </span> Play
            </button>
            <button type="button" class="save-btn" data-action="save">
              <span class="save-icon">
                <i data-lucide="bookmark"></i>
              </span> Save
            </button>
          </div>
          <div class="score-stat">
            <span class="score-stat-icon" aria-hidden="true">
              <i data-lucide="star"></i>
            </span>
            <span class="score-stat-value" data-field="score"></span>
            <span class="score-stat-max">/10</span>
          </div>
        </div>
      </div>
    </template>

    <template id="modal-template">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title-field" tabindex="-1">
        <button type="button" class="modal-close" data-action="close-modal" aria-label="Close">
          <i data-lucide="x"></i>
        </button>
 
        <div class="modal-banner">
          <div class="modal-banner-art" data-field="banner"></div>
          <div class="modal-banner-overlay" aria-hidden="true"></div>
        </div>
 
        <div class="modal-body">
          <div class="modal-heading">
            <h2 class="modal-title" id="modal-title-field" data-field="title"></h2>
            <div class="modal-native" data-field="native"></div>
            <div class="modal-meta" data-field="meta"></div>
          </div>
 
          <div class="modal-actions">
            <button type="button" class="save-btn" data-action="save">
              <span class="save-icon"><i data-lucide="bookmark"></i></span> Save
            </button>
            <div class="score-stat" data-section="score">
              <span class="score-stat-icon" aria-hidden="true">
                <i data-lucide="star"></i>
              </span>
              <span class="score-stat-value" data-field="score"></span>
              <span class="score-stat-max">/10</span>
            </div>
          </div>
 
          <!-- Only rendered if trailer exists AND site is youtube — no embed at all otherwise -->
          <section class="modal-section modal-trailer" data-section="trailer" hidden>
            <h3 class="modal-section-title">Trailer</h3>
            <div class="modal-trailer-embed" data-field="trailer"></div>
          </section>
 
          <!-- Always present, but content can be empty — description(asHtml:true) written via innerHTML -->
          <section class="modal-section" data-section="description">
            <h3 class="modal-section-title">Synopsis</h3>
            <div class="modal-description" data-field="description"></div>
          </section>
 
          <!-- Each row hidden individually — a title can have some facts and not others -->
          <section class="modal-section modal-facts" data-section="facts">
            <dl class="modal-fact-list">
              <div class="modal-fact" data-fact="studio" hidden>
                <dt>Studio</dt><dd data-field="studio"></dd>
              </div>
              <div class="modal-fact" data-fact="season" hidden>
                <dt>Season</dt><dd data-field="season"></dd>
              </div>
              <div class="modal-fact" data-fact="source" hidden>
                <dt>Source</dt><dd data-field="source"></dd>
              </div>
              <div class="modal-fact" data-fact="duration" hidden>
                <dt>Episode length</dt><dd data-field="duration"></dd>
              </div>
            </dl>
          </section>
 
          <!-- Hidden whole section if externalLinks has no STREAMING-type entries -->
          <section class="modal-section modal-watch" data-section="watch" hidden>
            <h3 class="modal-section-title">Where to Watch</h3>
            <div class="modal-watch-list" data-field="watch-links"></div>
          </section>
        </div>
      </div>
    </template>
 
    <!-- One clone per streaming service in externalLinks — count varies per title -->
    <template id="modal-watch-link-template">
      <a class="watch-pill" data-field="watch-link" target="_blank" rel="noopener noreferrer">
        <img class="watch-pill-icon" data-field="watch-icon" alt="" />
        <span data-field="watch-name"></span>
      </a>
    </template>
  </body>
  <script>
    lucide.createIcons();
  </script>
</html>
